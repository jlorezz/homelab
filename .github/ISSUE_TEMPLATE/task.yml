name: Task
description: Define an outcome and the evidence needed to finish it.
body:
  - type: markdown
    attributes:
      value: |
        Add this issue to the Homelab project. Move it to **Ready** when you want T3 to implement it, run independent review and required checks, and open a PR. Specify exact owned paths first. Merge and deployment remain separate.
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What needs to change, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe the observable result that completes this work.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Name exact owned paths, dependencies, and decisions already made. Required before moving to Ready for agent delivery.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and references
      description: Link logs, screenshots, related issues, PRs, or Brain notes. Remove secrets and customer data.
