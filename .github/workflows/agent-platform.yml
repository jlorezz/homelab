name: Agent platform

on:
  pull_request:
    paths:
      - .agents/**
      - .github/workflows/agent-platform.yml
      - stacks/agents/**
      - stacks/backups/**
      - stacks/dealpipe-recovery/**
      - stacks/github-runner/**
      - stacks/github-preview-runner/**
      - stacks/github-deploy-runner/**
      - stacks/agent-deploy/**
      - machines/nas/configuration.nix
      - machines/nas/modules/agent-deploy.nix
      - packages/**
      - machines/nas/modules/agent-platform.nix
      - machines/nas/modules/agent-knowledge.nix
      - machines/nas/modules/offsite-backup.nix
      - machines/nas/modules/dealpipe-recovery.nix
      - machines/nas/scripts/check-nas-health.py
      - machines/nas/modules/github-*.nix
      - flake.nix
      - flake.lock
  workflow_dispatch:
    inputs:
      build-image:
        description: Build the pinned development image (no deployment)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 cryptography==50.0.0 'psycopg[binary]==3.3.5'
      - run: python stacks/agents/doctor.py --source-only
      - run: python -m unittest discover -s stacks/agents/tests -v
      - run: python -m unittest discover -s stacks/github-runner/tests -v
      - run: python -m unittest discover -s stacks/agent-deploy/tests -v
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: python -m unittest discover -s stacks/backups/tests -v
      - run: python -m unittest discover -s stacks/dealpipe-recovery/tests -v
      - run: bash -n stacks/agents/prepare-workspaces.sh stacks/github-runner/entrypoint.sh stacks/agent-deploy/inventory.sh
      - run: shellcheck --severity=error stacks/agent-deploy/inventory.sh

  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - name: Parse changed platform definitions
        run: |
          for file in flake.nix packages/*.nix machines/nas/modules/agent-platform.nix machines/nas/modules/agent-knowledge.nix machines/nas/modules/offsite-backup.nix machines/nas/modules/dealpipe-recovery.nix machines/nas/modules/github-*.nix machines/nas/modules/agent-deploy.nix; do
            nix-instantiate --parse "$file" >/dev/null
          done
      - name: Evaluate complete NAS generation
        run: nix eval --raw .#nixosConfigurations.nas.config.system.build.toplevel.drvPath
      - name: Compare evaluated production unit with pre-parallelism source
        run: |
          git fetch --no-tags origin 4bfead617fc26e6d634b1696061729716127822b
          bash stacks/github-runner/production-equivalence.sh 4bfead617fc26e6d634b1696061729716127822b "$RUNNER_TEMP/production-equivalence"
      - name: Evaluate opt-in CI2 isolation and unchanged parent
        run: python3 stacks/github-runner/tests/check-ci2-nix.py
      - name: Reproduce the live NAS deploy units (C1)
        run: |
          git fetch --no-tags origin 4bfead617fc26e6d634b1696061729716127822b
          base=$(mktemp -d) && git archive 4bfead617fc26e6d634b1696061729716127822b | tar -x -C "$base"
          python3 stacks/github-runner/tests/check-live-deploy-units.py "$base"
      - name: Evaluate the disabled-by-default agent-deploy contract
        run: python3 stacks/agent-deploy/tests/check-agent-deploy-nix.py
      - name: Build and check exact application runtimes
        run: nix build .#agent-runtimes --print-build-logs
      - name: Build development image when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build-image }}
        run: nix build .#agent-image --print-build-logs
