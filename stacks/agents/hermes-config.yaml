# Seed /var/lib/agent-platform/hermes/config.yaml before the first launch.
# SURPLUS_API_KEY is stored separately in Hermes's private .env at runtime.
model:
  provider: custom:surplus-intelligence
  default: deepseek-v4.1-flash
  base_url: https://api.surplusintelligence.ai/v1
  context_length: 1000000
  supports_vision: true
providers:
  surplus-intelligence:
    name: Surplus Intelligence
    api: https://api.surplusintelligence.ai/v1
    key_env: SURPLUS_API_KEY
    transport: chat_completions
    default_model: deepseek-v4.1-flash
    models:
      deepseek-v4.1-flash:
        context_length: 1000000
        supports_vision: true
        supports_reasoning: true
terminal:
  backend: local  # "local" means inside this container, with only /workspace mounted.
  cwd: /workspace/homelab
  timeout: 180
agent:
  max_turns: 60
  api_max_retries: 3
  reasoning_effort: medium
goals:
  max_turns: 10
